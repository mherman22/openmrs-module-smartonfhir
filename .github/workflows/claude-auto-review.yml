name: Claude Auto Review

# Reviews every pull request as it opens, without anyone having to ask.
#
# The shared openmrs workflow cannot do this: its job `if:` requires
# github.event.issue.pull_request and the "@claude review" comment body, so under a
# pull_request trigger it would skip every time. That one stays for the deep on-demand
# pass; this is the automatic first look.
#
# Methodology is the same upstream pr-review skill the shared workflow pins, plus this
# repo's own addendum. Both are fetched from outside the pull request's tree -- the
# upstream one from a pinned commit, ours from the BASE commit -- so a pull request
# cannot rewrite the rules being used to review it.

on:
  pull_request:
    types: [ opened, ready_for_review ]
  # Re-review on demand: an updated pull request, or one that opened before this
  # workflow existed on its base branch.
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to review'
        required: true
        type: string

env:
  # Same pin the shared workflow uses. Bump deliberately, not automatically: this file
  # is the review methodology, and @main would change it under us without a diff.
  PR_REVIEW_SKILL_URL: >-
    https://raw.githubusercontent.com/openmrs/openmrs-module-querystore/5bc4e2602a88e81786d6794fc14748868c522c46/.claude/skills/pr-review/SKILL.md
  ADDENDUM_PATH: .claude/skills/smartonfhir-review/SKILL.md
  # Sonnet at medium, not Opus at max. This runs unattended on every pull request, where
  # the shared workflow runs once when a reviewer asks for it. "@claude review" still gets
  # the expensive pass.
  MODEL: claude-sonnet-5
  EFFORT: medium

jobs:
  review:
    # A manual run is already gated by who can press the button. An automatic one is not,
    # so it is restricted to branches in this repository: a pull request from a fork
    # receives no secrets, and its author would get a failed check instead of a review.
    # Same-repository also means the code was pushed by someone with write access, which
    # is what makes running the build below acceptable.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}

    steps:
      - name: Check out the pull request head
        uses: actions/checkout@v7
        with:
          # The head, not the merge commit: the review is of the author's code. Resolves
          # for a manual run too, where there is no pull_request event to default from.
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr }}/head
          # fetch-depth: 0 because the skill's verification needs real git history --
          # merge-base, diffing against the base, drift checks.
          fetch-depth: 0

      - name: Assemble the review methodology
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/review-methodology.md"

          # A manual run carries no event payload, so ask GitHub what this pull request
          # is based on.
          BASE_SHA="${EVENT_BASE_SHA:-$(gh pr view "$PR" --repo "$REPO" --json baseRefOid --jq .baseRefOid)}"
          echo "Reviewing PR #$PR, based on $BASE_SHA."

          curl -fsSL "$PR_REVIEW_SKILL_URL" -o "$dest"
          test -s "$dest"
          grep -q "name: pr-review" "$dest"
          echo "Base methodology: $(wc -l < "$dest") lines."

          # From the base commit, never the head: the addendum is part of the review's
          # trusted input. A pull request that edits it only takes effect once merged.
          # tr strips the newlines the contents API wraps its base64 in.
          if gh api "repos/$REPO/contents/$ADDENDUM_PATH?ref=$BASE_SHA" \
               --jq .content 2>/dev/null | tr -d '\n' | base64 -d >> "$dest"; then
            # A partial or garbled append would silently become the methodology.
            grep -q "name: smartonfhir-review" "$dest"
            echo "Appended this repo's addendum from $BASE_SHA."
          else
            echo "::warning::No $ADDENDUM_PATH on the base commit; reviewing with the upstream methodology only."
          fi

      - name: Review
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          # Set exactly one of these as a repository secret. CLAUDE_CODE_OAUTH_TOKEN comes
          # from `claude setup-token` and bills against a Pro/Max subscription;
          # ANTHROPIC_API_KEY is a console key billed as API usage. Both are passed because
          # the fork uses a subscription token while the openmrs organisation provides an
          # API key -- whichever secret exists is the one that gets used.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Post as github-actions[bot] rather than exchanging OIDC for a Claude App token.
          github_token: ${{ github.token }}
          allowed_non_write_users: "*"
          prompt: |
            Review pull request #${{ env.PR }} in the
            repository ${{ github.repository }}, following the PR-review
            methodology appended to your system prompt exactly: its verification
            requirements, its rules for every inline comment, and its posting
            rules. The methodology ends with an addendum specific to this
            repository; it adds to the base methodology and overrides nothing.

            Post the review the way the skill's `--post` does -- submit the
            findings as inline review comments through the GitHub API. Nobody is
            watching this run, so there is no one to report back to: if the pull
            request is clean, post nothing at all rather than saying so.

            You may build and test this repository -- `mvn clean install` and
            individual tests -- because the trigger admits only branches in this
            repository, whose authors already have write access. Running the
            build is often the only way to meet the methodology's verification
            bar here: a claim that a test would fail without the guard it covers
            cannot be settled by reading it. Do not modify the tree.
          claude_args: |
            --model ${{ env.MODEL }}
            --effort ${{ env.EFFORT }}
            --append-system-prompt-file ${{ runner.temp }}/review-methodology.md
            --max-turns 60
            --allowedTools "Bash,Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Write,Edit"
